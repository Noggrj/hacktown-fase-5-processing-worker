name: CI — fiapx-processing-worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispara o job "deploy" (build+push da imagem pro ECR, rollout no EKS).
  # Não roda em push/PR de propósito: sem cluster provisionado por padrão
  # (ver fiapx-infra), isso ficaria vermelho sempre. Ver "Deploy" no
  # README pros Secrets/Variables necessários antes de disparar.
  workflow_dispatch: {}

env:
  GO_VERSION: "1.25"
  COVERAGE_MIN: "70"
  # Packages with real business logic. Excluded from the gate:
  #   cmd/api                                  — process wiring
  #   internal/platform/{cache,storage,messaging,idempotency,logging} — thin
  #     infra wrappers, need live Redis/S3/Kafka to test meaningfully
  #   internal/saga                            — Kafka wiring, covered
  #     indirectly by fiapx-events' own transport/kafka tests
  # internal/processing/ffmpeg IS included even though its ffmpeg-exec
  # path only runs for real when the binary is on PATH (see
  # runner_integration_test.go, which self-skips otherwise) — this job's
  # container has ffmpeg installed via the same apk package as the
  # Dockerfile, so the integration test genuinely executes here.
  COVERAGE_PKGS: "./internal/processing/usecase/... ./internal/processing/ffmpeg/... ./internal/platform/config/... ./internal/platform/health/... ./internal/platform/metrics/..."

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fiapx-processing-worker
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install ffmpeg (for the runner integration test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Run full test suite
        run: go test -count=1 -race -timeout 120s ./...

      - name: Coverage (business-logic packages only)
        run: |
          go test -count=1 -coverprofile=coverage.out ${{ env.COVERAGE_PKGS }}
          go tool cover -func=coverage.out | tail -10

      - name: Coverage gate (>= ${{ env.COVERAGE_MIN }}%)
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "::notice::Coverage = $PCT% (gate $COVERAGE_MIN%)"
          awk -v p="$PCT" -v m="$COVERAGE_MIN" 'BEGIN{exit (p+0<m+0)?1:0}'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout fiapx-processing-worker
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only — no registry push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fiapx-processing-worker:ci
          build-args: VERSION=${{ github.sha }}

      - name: Container smoke test (local build only)
        run: |
          docker run --rm fiapx-processing-worker:ci ./server --version

  # Só roda com o disparo manual (workflow_dispatch) — nunca em push/PR.
  # Sem Secret de banco/JWT (worker não tem rota de negócio nem banco
  # próprio) — só precisa das credenciais AWS e do nome real do bucket.
  # Credenciais de S3 em produção vêm da role do node EKS, nunca de uma
  # env var estática (ver comentário em internal/platform/storage/s3.go).
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: production
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: fiapx-cluster
      ECR_REPO: fiapx-processing-worker
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          build-args: VERSION=${{ github.sha }}

      - name: Atualiza kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Aplica os manifests (com o nome real do bucket S3)
        run: |
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -
          sed "s/fiapx-videos-production/${{ vars.S3_BUCKET_NAME }}/" k8s/base/configmap.yaml | kubectl apply -f -
          kubectl apply -f k8s/base/namespace.yaml -f k8s/base/deployment.yaml -f k8s/base/service.yaml -f k8s/base/hpa.yaml

      - name: Atualiza a imagem do Deployment
        run: |
          kubectl set image deployment/fiapx-worker app=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }} -n fiapx
          kubectl rollout status deployment/fiapx-worker -n fiapx --timeout=180s
